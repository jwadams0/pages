<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>website</title>
<meta name="description" content="website">

<style>
  :root {
    --bg:   #FCFCFC;
    --ink:  #191919;
    --grey: #767676;
  }

  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --ink: #E8E8E8; --grey: #8C8C8C; }
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    padding: 2rem;

    background: var(--bg);
    color: var(--ink);
    font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main { max-width: 30rem; }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 0.5rem;
  }

  p { margin: 0 0 1.75rem; color: var(--grey); }

  nav a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--grey);
    margin-right: 1.25rem;
    padding-bottom: 1px;
  }
  nav a:hover { border-color: var(--ink); }
</style>
</head>

<body>
  <main>
    <h1>Jieyao Wang</h1>
    <p>PhD student.</p>
    <nav>
      <a href="mailto:jieyaow@live.unc.edu">Email</a>
      <a href="cv.html">CV</a>
      <a href="cv.html">Job Market Paper</a>
    </nav>
  </main>
</body>
</html>
